name: Bug report
description: Report a reproducible problem without exposing private robot or network information.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the project. Remove passwords, tokens, private IP addresses, Wi-Fi details, and identifiable camera imagery before submitting logs or screenshots.
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: Git commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python, Unitree SDK2, robot firmware, RealSense model/runtime, and relevant network topology.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checklist
      options:
        - label: I reproduced robot-motion behavior under supervision and used dry-run mode first where possible.
        - label: I removed secrets, personal data, and private network details from this report.
          required: true
