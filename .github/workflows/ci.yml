name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python and repository validation
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-laptop.txt PyYAML pytest

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          d1_hover_control_app.py d1_kinematics.py d1_stream_protocol.py
          send_d1_550_ik_to_arm.py test_d1_550_ik.py
          test_id0_apriltag_to_d1_hover.py test_tags3d_d435i_stream.py
          test_tags3d_live.py d1_sdk/src/ik_solver.py tests tools

      - name: Validate repository assets and documentation
        run: python tools/validation/validate_repository.py

      - name: Run hardware-independent tests
        run: python -m pytest -q tests

      - name: Run inverse-kinematics smoke test
        run: python test_d1_550_ik.py 0.35 0.00 0.20 --orientation none

      - name: Check whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          base="$PR_BASE_SHA"
          if [[ -z "$base" ]] && [[ -n "$PUSH_BASE_SHA" ]] && git cat-file -e "$PUSH_BASE_SHA^{commit}" 2>/dev/null; then
            base="$PUSH_BASE_SHA"
          fi
          if [[ -z "$base" ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          git diff --check "$base" HEAD --
